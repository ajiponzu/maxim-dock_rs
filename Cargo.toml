[package]
name = "maxim-dock_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

tempfile = "3"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
tray-icon = { version = "0.24", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading"] }
